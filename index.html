<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Serafina</title>
    <meta name="title" content="Serafina" />
    <meta name="description" content="Talk with Serafina - your private consultant online for all things sensible or uncanny. Uncensored, decentralized and self-hosted LLM platform brought to you by MuxAI." />
    <meta name="author" content="MuxAI" />

    <!-- Custom / AEO Meta Tags -->
    <meta name="type" content="Fictional Character" />
    <meta name="organization" content="Senturisk" />

    <!-- Open Graph / Facebook (Controls how links look on social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chat with Serafina" />
    <meta property="og:title" content="Serafina" />
    <meta property="og:description" content="Talk with Serafina - your private consultant online for all things sensible or uncanny. Uncensored, decentralized and self-hosted LLM platform brought to you by MuxAI." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Serafina" />
    <meta property="twitter:description" content="Talk with Serafina - your private consultant online for all things sensible or uncanny. Uncensored, decentralized and self-hosted LLM platform brought to you by MuxAI." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- JSON-LD Structured Data for Answer Engines (AEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "mainEntity": {
          "@type": "Person",
          "name": "Serafina",
          "alternateName": "Seraphina",
          "description": "Talk with Serafina - your private consultant online for all things sensible or uncanny. Uncensored, decentralized and self-hosted LLM platform brought to you by MuxAI.",
          "image": "/og-image.png",
          "affiliation": {
            "@type": "Organization",
            "name": "Senturisk"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
